# Wails v3 Linux 任务在目标架构主机上构建桌面应用。
version: '3'

includes:
  common: ./common.yml

tasks:
  build:
    summary: Builds the Linux desktop application natively
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}" ./desktop
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1

  package:
    summary: Builds the Linux desktop application for external packaging
    deps:
      - task: build

  run:
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}"'
