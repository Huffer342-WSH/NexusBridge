services:
  nexusbridge:
    image: ghcr.io/huffer342-wsh/nexusbridge:latest
    container_name: nexusbridge
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Shanghai
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "7890:7890"
      - "8080:8080"
      - "8090:8090"
      - "9090:9090"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    restart: unless-stopped
