components:
  parameters:
    SiteID:
      name: site_id
      in: path
      required: true
      schema:
        type: string
    TorrentID:
      name: torrent_id
      in: path
      required: true
      schema:
        type: string
    RuleName:
      name: rule_name
      in: path
      required: true
      schema:
        type: string
    SubscriptionID:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    Health:
      type: object
      required: [status, addr]
      properties:
        status:
          type: string
        addr:
          type: string
    Session:
      type: object
      required: [mode, requires_login]
      properties:
        mode:
          type: string
          enum: [local]
        requires_login:
          type: boolean
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    Site:
      type: object
      required: [id, name, base_url, has_cookie]
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
        user_agent:
          type: string
        has_cookie:
          type: boolean
    SiteCredential:
      type: object
      required: [site_id, base_url, user_agent, has_cookie]
      properties:
        site_id:
          type: string
        base_url:
          type: string
        user_agent:
          type: string
        cookie:
          type: string
          description: 只允许请求时提交；响应会清空。
        has_cookie:
          type: boolean
    SiteAttendance:
      type: object
      required: [site_id, configured, enabled, time_of_day, timezone]
      properties:
        site_id:
          type: string
          readOnly: true
        configured:
          type: boolean
          readOnly: true
        enabled:
          type: boolean
          default: false
        time_of_day:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          default: "09:00"
        timezone:
          type: string
          description: 有效的 IANA 时区；未配置时为空。
          example: Asia/Shanghai
        last_run_at:
          type: string
          format: date-time
          readOnly: true
        next_run_at:
          type: string
          format: date-time
          readOnly: true
        last_error:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SiteAttendanceInput:
      type: object
      required: [enabled, time_of_day, timezone]
      properties:
        enabled:
          type: boolean
        time_of_day:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        timezone:
          type: string
          example: Asia/Shanghai
    Torrent:
      type: object
