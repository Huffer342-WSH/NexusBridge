openapi: 3.1.0
info:
  title: NexusBridge HTTP API
  version: 0.1.0
  description: |
    NexusBridge 后端 HTTP API 契约。当前文件描述已实现接口，前端新需求先写入 docs/api/requests.md。
servers:
  - url: http://0.0.0.0:8090
    description: 本地默认服务
tags:
  - name: health
    description: 健康检查
  - name: session
    description: 本地会话
  - name: sites
    description: 站点和凭据
  - name: torrents
    description: 本地种子缓存和手动下载
  - name: rules
    description: 筛选规则
  - name: subscriptions
    description: 自动订阅、站点计划和运行记录
  - name: settings
    description: 应用设置
  - name: qbittorrent
    description: qBittorrent 同步、分类、标签和下载计划
  - name: organize
    description: 下载整理
  - name: rss
    description: RSS 预留接口
paths:
  /api/health:
    get:
      tags: [health]
      summary: 获取服务健康状态
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/session:
    get:
      tags: [session]
      summary: 获取本地会话模式
      responses:
        "200":
          description: 会话状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /api/session/login:
    post:
      tags: [session]
      summary: 本地登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/sites:
    get:
      tags: [sites]
      summary: 获取站点列表
      responses:
        "200":
          description: 站点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
        "500":
          $ref: "#/components/responses/Error"
  /api/sites/{site_id}/credential:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      tags: [sites]
      summary: 获取站点凭据状态
      responses:
        "200":
          description: 站点凭据状态，不返回 cookie 明文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCredential"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [sites]
      summary: 保存站点 cookie 和 user-agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCredential"
      responses:
        "200":
          description: 已保存的凭据状态，不返回 cookie 明文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCredential"
        "400":
          $ref: "#/components/responses/Error"
  /api/sites/{site_id}/attendance:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      tags: [sites]
      summary: 获取站点自动签到配置
      responses:
        "200":
          description: 已保存配置，或关闭且未配置时区的默认配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAttendance"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [sites]
      summary: 保存站点自动签到配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteAttendanceInput"
      responses:
        "200":
          description: 已保存配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAttendance"
        "400":
          $ref: "#/components/responses/Error"
  /api/sites/{site_id}/fetch:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      tags: [sites]
      summary: 创建统一的站点分页扫描任务
      parameters:
        - name: trigger
          in: query
          required: false
          description: 媒体页自动触发时传 homepage，其余请求可省略。
          schema:
            type: string
            enum: [manual, homepage]
            default: manual
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteFetchRequest"
      responses:
        "202":
          description: 已创建任务，或返回同站点现有活动任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteFetchJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/site-fetch-jobs:
    get:
      tags: [sites, subscriptions]
      summary: 获取持久化站点扫描任务
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: 最近扫描任务
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteFetchJob"
        "500":
          $ref: "#/components/responses/Error"
  /api/sites/{site_id}/schedule:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      tags: [sites, subscriptions]
      summary: 获取站点周期抓取配置
      responses:
        "200":
          description: 已保存配置，或关闭且间隔为 15 分钟的默认配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSchedule"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [sites, subscriptions]
      summary: 保存站点周期抓取配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteScheduleInput"
      responses:
        "200":
          description: 已保存配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSchedule"
        "400":
          $ref: "#/components/responses/Error"
  /api/sites/{site_id}/filter-options:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      tags: [sites, rules]
      summary: 获取单站点规则编辑器的本地筛选选项
      responses:
        "200":
          description: 分类和标签来自已抓取种子，促销来自站点检索定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleFilterOptions"
        "400":
          $ref: "#/components/responses/Error"
  /api/torrents:
    get:
      tags: [torrents]
      summary: 分页查询本地种子缓存
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: site_id
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: qb_task
          in: query
          required: false
          description: 按本地种子是否关联当前 qB 任务筛选；列表请求不会主动访问 qB。
          schema:
            type: string
            enum: [present, absent]
        - name: qb_progress
          in: query
          required: false
          description: 仅与 qb_task=present 一起使用；complete 为 progress >= 1。
          schema:
            type: string
            enum: [complete, incomplete]
        - name: include_pinned
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [source_order, published_at, size_bytes, seeders, leechers, snatches]
            default: published_at
        - name: sort_direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: 筛选、排序和范围截取后的种子页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentPage"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: progress 筛选所需的 qB 运行态尚未完成首次同步
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/playback/torrents:
    get:
      tags: [torrents, qbittorrent]
      summary: 查询含有完整音频或视频文件的其他 qB 种子
      parameters:
        - name: exclude_site_id
          in: query
          required: false
          schema:
            type: string
        - name: exclude_torrent_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 按站点发布时间倒序的其他可播放种子
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaybackTorrent"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/playback:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
    get:
      tags: [torrents, qbittorrent]
      summary: 获取当前种子的实时媒体播放清单
      parameters:
        - name: file
          in: query
          required: false
          description: 要选中的 qB 相对文件名；省略时使用默认媒体。
          schema:
            type: string
      responses:
        "200":
          description: 种子元数据、qB 状态、媒体选集和默认文件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackContext"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/playback/qb/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [qbittorrent]
      summary: 按 qB hash 获取实时媒体播放上下文
      parameters:
        - name: file
          in: query
          required: false
          description: 要选中的 qB 相对文件名；省略时使用默认媒体。
          schema:
            type: string
      responses:
        "200":
          description: qB 选集、当前文件、所在目录及可选数据库种子详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackContext"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/playback/file:
    get:
      tags: [files, qbittorrent]
      summary: 按本机文件自动识别播放上下文
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 自动归一到数据库种子、qB 任务或单文件播放上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackContext"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/media/{file_index}:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
      - name: file_index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    get:
      tags: [torrents, qbittorrent]
      summary: 按 qB 文件索引传输同机源媒体文件
      responses:
        "200":
          description: 完整文件或 Range 响应
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 字节范围响应
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    head:
      tags: [torrents, qbittorrent]
      summary: 查询同机源媒体文件响应头
      responses:
        "200":
          description: 文件长度、类型、修改时间和 Range 能力
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/playback/qb/{hash}/media/{file_index}:
    parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: file_index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    get:
      tags: [qbittorrent]
      summary: 按 qB hash 和文件索引传输源媒体
      responses:
        "200":
          description: 完整文件或 Range 响应
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 字节范围响应
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    head:
      tags: [qbittorrent]
      summary: 查询 qB 源媒体响应头
      responses:
        "200":
          description: 文件长度、类型、修改时间和 Range 能力
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/playback/file/media:
    get:
      tags: [files]
      summary: 传输本机源媒体文件
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 完整文件或 Range 响应
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 字节范围响应
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    head:
      tags: [files]
      summary: 查询本机源媒体响应头
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件长度、类型、修改时间和 Range 能力
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/media/{file_index}/subtitles/{track_id}:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
      - name: file_index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
      - name: track_id
        in: path
        required: true
        schema: { type: integer, minimum: 1, format: int64 }
    get:
      tags: [torrents, qbittorrent]
      summary: 导出数据库种子 MKV 文件的内嵌文本字幕
      responses:
        "200":
          description: WebVTT 字幕
          content:
            text/vtt:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/playback/qb/{hash}/media/{file_index}/subtitles/{track_id}:
    parameters:
      - name: hash
        in: path
        required: true
        schema: { type: string }
      - name: file_index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
      - name: track_id
        in: path
        required: true
        schema: { type: integer, minimum: 1, format: int64 }
    get:
      tags: [qbittorrent]
      summary: 导出 qB 任务 MKV 文件的内嵌文本字幕
      responses:
        "200":
          description: WebVTT 字幕
          content:
            text/vtt:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/playback/file/subtitles/{track_id}:
    parameters:
      - name: track_id
        in: path
        required: true
        schema: { type: integer, minimum: 1, format: int64 }
    get:
      tags: [files]
      summary: 导出本机 MKV 文件的内嵌文本字幕
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: WebVTT 字幕
          content:
            text/vtt:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/qb-status:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
    get:
      tags: [torrents, qbittorrent]
      summary: 实时刷新单个种子的 qB 状态并写入快照
      parameters:
        - name: weak_match
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: qB 状态快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QBTorrentStatus"
        "404":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/qb-control:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
    post:
      tags: [torrents, qbittorrent]
      summary: 暂停或恢复单个种子的 qB 任务并刷新快照
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QBTorrentControlRequest"
      responses:
        "200":
          description: 操作后的 qB 状态快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QBTorrentStatus"
        "400":
          $ref: "#/components/responses/Error"
  /api/qb/torrents/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        description: 单个 40 或 64 位十六进制 info hash；不接受 all。
        schema:
          type: string
          pattern: "^[0-9A-Fa-f]{40}([0-9A-Fa-f]{24})?$"
    delete:
      tags: [qbittorrent]
      summary: 删除单个 qB 任务并选择是否同时删除下载文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QBTorrentDeleteRequest"
      responses:
        "200":
          description: qB 任务已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/cover:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
    get:
      tags: [torrents]
      summary: 使用站点请求规则和凭据代理种子封面图片
      responses:
        "200":
          description: WebP、JPEG、PNG 等封面图片
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/download/preview:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
    post:
      tags: [torrents]
      summary: 预览手动下载标题整理结果
      responses:
        "200":
          description: 下载预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPreview"
        "400":
          $ref: "#/components/responses/Error"
  /api/torrents/{site_id}/{torrent_id}/download:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/TorrentID"
    post:
      tags: [torrents]
      summary: 计算并验证 info hash 后发送单个种子到 qBittorrent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualDownloadRequest"
      responses:
        "202":
          description: 已创建下载任务并执行发送；任务体中的 status 表示实际结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTask"
        "400":
          $ref: "#/components/responses/Error"
  /api/rules:
    get:
      tags: [rules]
      summary: 获取筛选规则
      responses:
        "200":
          description: 规则列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [rules]
      summary: 保存筛选规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rule"
      responses:
        "200":
