          type: string
        options:
          $ref: "#/components/schemas/DownloadOptions"
      oneOf:
        - required: [subscription_id]
        - required: [options]
    BatchDownloadPreview:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPreviewItem"
    BatchDownloadResult:
      type: object
      required: [attempted, sent, exists, failed, skipped, tasks]
      properties:
        attempted:
          type: integer
        sent:
          type: integer
        exists:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/DownloadTask"
    QBittorrentConfig:
      type: object
      required: [auth_mode, url, api_key, username, user_id, password, category, tags, auto_sync, sync_interval_seconds, inactive_sync_interval_seconds, disconnected_sync_interval_seconds]
      properties:
        auth_mode:
          type: string
          enum: [uid, api_key]
        url:
          type: string
        api_key:
          type: string
          description: 响应中为空；请求为空时保留已保存值。
        username:
          type: string
        user_id:
          type: string
        password:
          type: string
          description: 响应中为空；请求为空时保留已保存值。
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        auto_sync:
          type: boolean
        sync_interval_seconds:
          type: integer
          minimum: 2
          maximum: 60
        inactive_sync_interval_seconds:
          type: integer
          minimum: 10
          maximum: 300
        disconnected_sync_interval_seconds:
          type: integer
          minimum: 15
          maximum: 600
