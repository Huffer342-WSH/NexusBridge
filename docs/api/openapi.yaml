      required: [path]
      properties:
        path:
          type: string
        site_ids:
          type: array
          items:
            type: string
        search_mode:
          type: string
          enum: [database, site, database_then_site]
          default: database
        max_depth:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
    RecoveryScanItem:
      type: object
      required: [path, name, is_dir, status, preview]
      properties:
        path:
          type: string
        name:
          type: string
        is_dir:
          type: boolean
        status:
          type: string
          enum: [matched, ambiguous, none, error]
        reason:
          type: string
        preview:
          $ref: "#/components/schemas/RecoveryPreview"
    RecoveryScanResult:
      type: object
      required: [path, evaluated, matched, truncated, items]
      properties:
        path:
          type: string
        evaluated:
          type: integer
        matched:
          type: integer
        truncated:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryScanItem"
    RecoveryBatchItemRequest:
      type: object
      required: [path, site_id, torrent_id]
      properties:
        path:
          type: string
        site_id:
          type: string
        torrent_id:
          type: string
        category:
          type: string
    RecoveryBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/RecoveryBatchItemRequest"
        web_search:
          type: boolean
          default: false
    RecoveryBatchItemResult:
      type: object
      required: [path, site_id, torrent_id, status]
      properties:
        path:
          type: string
        site_id:
          type: string
        torrent_id:
          type: string
        status:
          type: string
          enum: [recovered, needs_attention, failed, skipped]
        error:
          type: string
        result:
          $ref: "#/components/schemas/RecoveryResult"
    RecoveryBatchResult:
      type: object
      required: [attempted, recovered, needs_attention, failed, skipped, items]
      properties:
        attempted:
          type: integer
        recovered:
          type: integer
        needs_attention:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryBatchItemResult"
    TorrentKey:
